services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    env_file: ./env/database/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Application qui tourne toutes les 10 minutes
  recovery_match:
    image: xwdrblue/recoveries_match:1.0.0
    container_name: recovery_match
    restart: unless-stopped
    env_file: ./env/recovery-match/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    command: >
      sh -c "
      while true; do
        echo '[$(date)] Exécution de l application...' &&
        npm run load-data &&
        echo '[$(date)] Terminé. Attente de 10 minutes...' &&
        sleep 600
      done
      "

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge